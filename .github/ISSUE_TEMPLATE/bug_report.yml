name: Informe de error
description: Algo no funciona como esperas
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar. No incluyas secretos, tokens ni datos personales.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué ocurre y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ejecutar `make base`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: main @ abc1234
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo y versiones de Docker, Node, pnpm y Make.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias
      description: Registros o capturas, sin datos sensibles.
    validations:
      required: false
