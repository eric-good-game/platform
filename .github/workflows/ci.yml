name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate the pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: |
            El asunto debe empezar en minúscula, por ejemplo "feat(identity): add login endpoint".

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Markdown
        run: npx --yes markdownlint-cli2@0.18.0
      - name: YAML
        run: npx --yes yaml-lint@1.7.0 '.github/**/*.{yml,yaml}' docker-compose.yml compose.debug.yml
      - name: Repository checks
        run: node scripts/check-repo.mjs

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate secrets
        run: make setup
      - name: Validate the Compose file
        run: make validate
      - name: Start the base platform
        run: make base
      - name: Check health, broker and database isolation
        run: make check
      - name: Tear down
        if: always()
        run: make reset
